<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic 8-Ball</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(74, 144, 217, 0.5);
        }

        .ball {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 30% 30%, #2a2a4a, #0a0a15);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 -20px 40px rgba(0, 0, 0, 0.4),
                inset 0 20px 40px rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .ball:hover {
            transform: scale(1.02);
        }

        .ball.shaking {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg) scale(1.05); }
            75% { transform: rotate(10deg) scale(1.05); }
        }

        .window {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #1e3a5f, #0d1b2a);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #2a4a6a;
        }

        .answer {
            color: #4a90d9;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            line-height: 1.3;
            transition: all 0.3s;
        }

        .answer.positive { color: #4ade80; }
        .answer.neutral { color: #fbbf24; }
        .answer.negative { color: #f87171; }

        .input-section {
            margin-top: 20px;
        }

        input[type="text"] {
            padding: 15px 20px;
            font-size: 1rem;
            width: 300px;
            max-width: 90vw;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(74, 144, 217, 0.3);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            display: block;
            margin: 20px auto 0;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #4a90d9, #357abd);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(74, 144, 217, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 144, 217, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Magic 8-Ball</h1>

        <div class="ball" onclick="shake()">
            <div class="window">
                <div class="answer" id="answer">8</div>
            </div>
        </div>

        <div class="input-section">
            <input
                type="text"
                id="question"
                placeholder="Ask a yes/no question..."
                onkeypress="if(event.key === 'Enter') shake()"
            >
            <button onclick="shake()">Shake the Ball!</button>
        </div>

        <p class="instructions">Type a question and click the ball or button</p>
    </div>

    <script>
        const responses = [
            { text: "Yes, definitely!", type: "positive" },
            { text: "It is certain.", type: "positive" },
            { text: "Without a doubt.", type: "positive" },
            { text: "Most likely.", type: "positive" },
            { text: "Signs point to yes.", type: "positive" },
            { text: "Ask again later.", type: "neutral" },
            { text: "Cannot predict now.", type: "neutral" },
            { text: "Concentrate and ask again.", type: "neutral" },
            { text: "Don't count on it.", type: "negative" },
            { text: "My sources say no.", type: "negative" },
            { text: "Outlook not so good.", type: "negative" },
            { text: "Very doubtful.", type: "negative" }
        ];

        function shake() {
            const question = document.getElementById('question').value.trim();
            const answerEl = document.getElementById('answer');
            const ball = document.querySelector('.ball');

            if (!question) {
                answerEl.textContent = "Ask something first!";
                answerEl.className = "answer neutral";
                return;
            }

            // Add shake animation
            ball.classList.add('shaking');
            answerEl.textContent = "...";

            setTimeout(() => {
                const response = responses[Math.floor(Math.random() * responses.length)];
                answerEl.textContent = response.text;
                answerEl.className = "answer " + response.type;
                ball.classList.remove('shaking');

                // Clear input
                document.getElementById('question').value = '';
            }, 500);
        }
    </script>
</body>
</html>
